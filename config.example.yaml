# pve-optimizer — Beispielkonfiguration
#
# Kopieren nach /etc/pve-optimizer/config.yaml und anpassen.

# Betriebsart:
#   local  ruft pvesh auf dem Node auf, auf dem der Dienst läuft.
#          Kein Token nötig, dafür auf jedem Node installieren.
#   api    spricht über HTTPS mit der Cluster-API und sieht alle Nodes.
#          Einmal installieren, braucht einen API-Token.
mode: local

# Nur die VMs des Nodes bearbeiten, auf dem der Dienst läuft.
#
# Wichtig bei mode: local — auch dort greift pvesh clusterweit zu. Ohne
# diese Grenze würden sich mehrere Instanzen dieselben VMs vornehmen.
# Vorgabe: bei mode: local an, bei mode: api aus.
#
# only_own_node: true
#
# Der eigene Node-Name. Leer bedeutet: der Hostname des Rechners, was bei
# Proxmox dem Node-Namen entspricht.
# node: vmh02

# Wie oft die Aufgabenliste abgefragt wird.
poll_interval: 30s

# Nur protokollieren, nichts schreiben — zum Ausprobieren.
dry_run: false

# Merkt sich, bis wohin die Aufgaben abgearbeitet sind.
state_file: /var/lib/pve-optimizer/state.json

# Nur für mode: api.
api:
  url: https://pve.example.com:8006
  token_id: root@pam!pve-optimizer
  # Das Secret gehört nicht hierher, sondern in die Umgebungsvariable
  # PVE_OPTIMIZER_TOKEN_SECRET (siehe systemd-Unit im README).
  token_secret: ""
  # Nur setzen, wenn Proxmox ein selbstsigniertes Zertifikat ausliefert.
  insecure_skip_verify: false

# Greift für jeden Speicherpool, der unten nicht aufgeführt ist.
# Ohne diesen Abschnitt startet der Dienst nicht — ein unbekannter Pool
# soll nie ungedrosselt bleiben.
defaults:
  mbps_rd: 200 # Dauerrate Lesen in MB/s
  mbps_wr: 150 # Dauerrate Schreiben in MB/s
  iops_rd: 5000
  iops_wr: 3000

# Profile je Speicherpool. Der Pool ist der Name vor dem Doppelpunkt im
# Plattenwert, z. B. "local-pool" bei "local-pool:vm-100-disk-0".
# Ein Wert von 0 oder ein weggelassener Schlüssel heißt: nicht setzen.
#
# Abweichungen einzelner Nodes stehen weiter unten unter "nodes:".
pools:
  # Mit Burst: kurze Lastspitzen dürfen über die Dauerrate hinausgehen.
  # Wichtig: Zu jedem "_max" gehört die zugehörige Dauer, sonst burstet
  # QEMU nur eine Sekunde und die Spitze bringt nichts. Die Dauer heißt
  # beim Durchsatz "bps_..._max_length" — nicht "mbps_...".
  local-pool:
    mbps_rd: 500 # Dauerrate
    mbps_wr: 400
    mbps_rd_max: 800 # Spitze
    mbps_wr_max: 600
    bps_rd_max_length: 10 # ... für höchstens 10 Sekunden
    bps_wr_max_length: 10
    iops_rd: 20000
    iops_wr: 15000
    iops_rd_max: 40000
    iops_wr_max: 30000
    iops_rd_max_length: 10
    iops_wr_max_length: 10

  # Ohne Burst: strikt die Dauerrate.
  rpool:
    mbps_rd: 300
    mbps_wr: 200
    iops_rd: 10000
    iops_wr: 8000


# ---------------------------------------------------------------------------
# Regeln
# ---------------------------------------------------------------------------
#
# Jede Regel prüft einen Punkt und trägt nach, was fehlt. Bereits gesetzte
# Werte bleiben unangetastet — der Dienst ergänzt nur, er korrigiert nicht.
#
# Jede Regel hat einen Modus:
#
#   off       die Regel läuft nicht
#   report    die Regel protokolliert, was sie ergänzen würde, schreibt
#             aber nichts — der Weg, eine Regel erst einmal zu beobachten
#   enforce   die Regel schreibt
#
# Kurzform ist der Modus allein ("discard: enforce"), Langform eine
# Zuordnung mit "mode" und den Optionen der Regel.
#
# Vorgabe ohne diesen Abschnitt: io_limits ist scharf, alles Weitere aus.
# dry_run oben senkt jede scharfe Regel auf "report" ab.
#
# In dieser Vorlage stehen alle Regeln außer der IO-Begrenzung auf
# "report": erst ins Protokoll schauen, was sie an den eigenen VMs täten,
# dann scharf schalten.
rules:
  # Die IO-Begrenzung aus den Profilen oben.
  io_limits: enforce

  # Gelöschte Blöcke an den Speicher zurückgeben. Ohne das wächst eine
  # dünn bereitgestellte Platte immer weiter, auch wenn im Gast
  # aufgeräumt wird. Ohne "pools" gilt die Regel für alle.
  discard:
    mode: report
    pools: [local-pool]

  # Dem Gast melden, dass die Platte nicht dreht. Linux und Windows
  # schalten daraufhin die Optimierungen für Magnetplatten ab und
  # schicken von sich aus TRIM-Befehle. virtio-blk kennt das Kennzeichen
  # nicht und wird übersprungen.
  ssd:
    mode: report
    pools: [local-pool]

  # Eigener Thread je Platte statt alles über den Haupt-Thread von QEMU.
  # Am SCSI-Bus geht das nur mit scsihw: virtio-scsi-single — sonst wird
  # die Platte übersprungen. Den Controller stellt der Dienst nicht um,
  # das ist ein Eingriff, nach dem manches Windows nicht mehr bootet.
  iothread: report

  # Den QEMU-Gast-Agenten erlauben. Ohne ihn ist ein Herunterfahren nur
  # ein Druck auf den Ausschalter, und beim Backup fehlt das Einfrieren
  # des Dateisystems — die Sicherung ist dann nur so konsistent wie nach
  # einem Stromausfall. Im Gast muss der Agent zusätzlich installiert
  # sein; ist er nicht da, ändert sich nichts.
  guest_agent:
    mode: report
    # Nach einem Klon oder einer Verschiebung im Gast aufräumen lassen.
    fstrim_cloned_disks: true

  # Den Start nach einem Neustart des Nodes staffeln: "up" ist der
  # Abstand, den Proxmox nach diesem Gast einhält, bevor der nächste
  # startet. Ohne das fahren alle automatisch startenden Gäste
  # gleichzeitig hoch und erzeugen genau die Lastspitze, gegen die die
  # IO-Begrenzung sonst arbeitet.
  #
  # Als einzige Regel betrifft sie auch Container — ein Node fährt beide
  # Gastarten gemeinsam hoch. Weil ein Container in Sekunden oben ist,
  # eine VM aber erst ihr BIOS durchläuft, lässt sich der Abstand je
  # Gastart getrennt setzen:
  #
  #   up          gilt für beide, solange darunter nichts Genaueres steht
  #   vm.up       nur für VMs
  #   lxc.up      nur für Container
  #
  # Ein Abstand von 0 heißt hier wie überall: nicht setzen. So bleibt
  # eine Gastart ganz unangetastet.
  #
  # Angefasst wird nur, was ohnehin automatisch mitstartet (onboot: 1).
  # Ob ein Gast mitstarten soll, entscheidet der Betreiber — eine
  # fehlende Angabe ist hier keine vergessene Einstellung.
  startup:
    mode: report
    vm:
      up: 45s
    lxc:
      up: 10s

  # Begrenzen, wie viel über die Netzwerkkarten eines Gastes laufen darf.
  # Ohne das zieht ein einzelner Gast die Leitung des Nodes leer — ein
  # Backup, ein Klon oder ein durchgedrehter Dienst genügt, und alle
  # anderen Gäste auf derselben Brücke hängen mit.
  #
  # Die Einheit ist Megabyte je Sekunde, so wie Proxmox sie führt — nicht
  # Megabit. Eine Gigabit-Leitung sind also 125, 100 Mbit/s sind 12.5.
  #
  # Proxmox kennt "rate" bei VMs und Containern gleichermaßen, deshalb
  # gilt die Regel für beide und lässt sich wie die Staffelung je Gastart
  # trennen:
  #
  #   rate        gilt für beide, solange darunter nichts Genaueres steht
  #   vm.rate     nur für VMs
  #   lxc.rate    nur für Container
  #
  # Eine Rate von 0 heißt hier wie überall: nicht setzen.
  #
  # Ergänzt wird an jeder Karte, die noch keine Begrenzung trägt. Nach
  # Brücke unterscheiden kann die Regel nicht — hängt ein Gast am 1G-LAN
  # und am 10G-Speichernetz, bekommen beide Karten denselben Wert. Wer das
  # trennen muss, setzt die zweite von Hand; gesetzte Werte bleiben.
  net_rate:
    mode: report
    vm:
      rate: 125
    lxc:
      rate: 12.5

# ---------------------------------------------------------------------------
# Dienst-Monitor
# ---------------------------------------------------------------------------
#
# Holt abgestürzte systemd-Dienste des Nodes wieder hoch. Hintergrund ist
# eine Eigenheit von Proxmox: Units wie pvestatd.service bringen kein
# "Restart=" mit. Stirbt so ein Dienst an einem Signal, bleibt er liegen,
# bis jemand ihn von Hand startet.
#
# Blind endlos neu starten hilft aber auch nicht — ein Dienst, der immer
# wieder stirbt, hat eine Ursache, die ein Neustart nicht behebt. Deshalb
# zählt der Monitor mit, steigt nach "restart_limit" Versuchen aus und
# meldet sich dann bei einem Menschen.
#
# Derselbe Modus wie bei den Regeln:
#
#   off       der Monitor läuft nicht (Vorgabe)
#   report    er schreibt den Absturz ins Protokoll, startet aber nichts
#             neu und verschickt auch keine Mail
#   enforce   er startet neu und meldet
#
# dry_run oben senkt ihn wie jede Regel auf "report" ab.
#
# Er sieht immer nur die Maschine, auf der er läuft — bei mode: api also
# nicht zwangsläufig den Node, dessen Gäste der Dienst betreut.
#
# services:
#   mode: enforce
#
#   # Die zu überwachenden Units. Ein von Hand angehaltener Dienst steht
#   # auf "inactive" und bleibt unangetastet; hochgeholt wird nur, was
#   # systemd als fehlgeschlagen führt.
#   units:
#     - pvestatd.service
#
#   # So viele Neustarts je Dienst, dann ist Schluss.
#   restart_limit: 3
#
#   # Läuft der Dienst so lange am Stück, gilt er wieder als gesund: Der
#   # Zähler fällt auf null, die nächste Störung beginnt von vorn.
#   stable_after: 24h
#
#   # Wohin die Meldung geht, steht weiter unten unter "mail:" — der
#   # Zugang gilt für den ganzen Dienst.
#
# Der Zählerstand liegt neben dem Stand der Aufgabenliste, als
# services.json im Verzeichnis von "state_file" oben.

# ---------------------------------------------------------------------------
# Mailzugang
# ---------------------------------------------------------------------------
#
# Ein Zugang für den ganzen Dienst: Dienst-Monitor und alles Weitere, was
# sich melden muss, teilen ihn sich.
#
# Bewusst ein eigener SMTP-Zugang und nicht das sendmail des Nodes: Ein
# frisch aufgesetzter Proxmox-Node hat zwar ein postfix, aber keinen Relay
# und eine Platzhalteradresse als Empfänger. Eine Mail über diesen Weg
# landet in der Warteschlange und nie bei einem Menschen.
#
# Ohne diesen Abschnitt bleibt jede Meldung im Protokoll — eine gültige
# Wahl: Der Dienst-Monitor startet abgestürzte Dienste auch dann wieder.
#
# Achtung beim Umstieg von v0.5.x: Der Zugang stand vorher unter
# "services.mail". Wer ihn dort stehen lässt, bekommt beim Start einen
# Fehler mit dem Hinweis auf den neuen Platz.
#
# mail:
#   to: admin@example.com
#   server: mail.example.com:25
#   # Vorgabe: pve-optimizer@<rechnername> — dann steht im Posteingang,
#   # von welchem Node die Meldung kam.
#   from: ""
#   # Nur, wenn der Server eine Anmeldung verlangt. Das Passwort gehört
#   # nicht hierher, sondern in die Umgebungsvariable
#   # PVE_OPTIMIZER_SMTP_PASSWORD (siehe systemd-Unit im README).
#   username: ""

# ---------------------------------------------------------------------------
# Empfehlungen
# ---------------------------------------------------------------------------
#
# Prüfungen, die nachsehen und sagen, was auffällt — und dabei NICHTS
# ändern. Manches gehört in Menschenhand: Welche VM in welchen
# Sicherungsauftrag gehört, mit welchem Zeitplan und welcher Aufbewahrung,
# weiß der Dienst nicht und soll es nicht raten.
#
# Aufruf von Hand:
#   pve-optimizer -config /etc/pve-optimizer/config.yaml -check
#
# Anders als die Regeln sind sie von Haus aus AN — sie ändern nichts, und
# was man nicht sieht, kann man nicht abstellen. Erlaubt sind nur "off" und
# "report"; "enforce" weist der Dienst beim Start ab. dry_run wirkt hier
# nicht, es gäbe nichts abzuschwächen.
advice:
  # Gäste, die kein Sicherungsauftrag erfasst.
  #
  # Die Frage beantwortet Proxmox selbst — die Feinheiten von "all",
  # "pool" und "exclude" sind hier nicht nachgebaut.
  #
  # Der häufigste Weg in die Lücke ist harmlos und deshalb tückisch: Ein
  # Auftrag mit fester VMID-Liste erfasst neue Gäste nicht. Wer eine VM
  # anlegt und den Auftrag nicht anfasst, hat sie nicht gesichert.
  backup_coverage:
    mode: report
    # Gäste, die bewusst keine Sicherung brauchen — Testgäste,
    # Wegwerf-VMs, Gäste mit eigener Sicherung im Gast.
    #
    # Die Prüfung meldet auch verwaiste Einträge: Nummern, zu denen es
    # keinen Gast mehr gibt. Proxmox vergibt gelöschte VMIDs wieder, ein
    # alter Eintrag würde sonst stillschweigend einen neuen Gast ausnehmen.
    ignore: []

  # Fehlende Bandbreitengrenzen unter Rechenzentrum → Optionen.
  #
  # Ein ungebremster Vorgang zieht die Leitung leer. Teilt sich der
  # Cluster-Verkehr dieselbe Leitung, kann ein Wiederherstellen Corosync
  # abschnüren — im schlimmsten Fall verlieren die Nodes ihr Quorum.
  #
  # Achtung bei der Einheit: Proxmox rechnet dort in KiB/s, nicht in MB/s
  # wie an Platten und Netzwerkkarten. "default" deckt alles ab, was keine
  # eigene Grenze hat.
  bandwidth_limits: report

  # Replikationsaufträge ohne Ratenbegrenzung. Nach einer größeren
  # Änderung im Gast überträgt ein Auftrag schlagartig viel und nimmt
  # sich, was die Leitung hergibt. Die Rate wird dort in MB/s angegeben.
  replication_rate: report

# ---------------------------------------------------------------------------
# Abweichungen je Node
# ---------------------------------------------------------------------------
#
# Alles oben gilt clusterweit. Hier steht, was auf einzelnen Nodes anders
# ist — genannt wird nur das Abweichende, der Rest bleibt wie oben.
#
# Für Regeln gilt dabei: Wer nur den Modus nennt, behält deren übrige
# Optionen aus dem allgemeinen Abschnitt.
#
# Gesucht wird ein Profil von speziell nach allgemein:
#
#   nodes.<node>.pools.<pool>   dieser Pool auf diesem Node
#   pools.<pool>                dieser Pool auf allen Nodes
#   nodes.<node>.defaults       alles Übrige auf diesem Node
#   defaults                    alles Übrige
#
# Welches Profil gegriffen hat, steht im Protokoll.
#
# nodes:
#   vmh03:
#     rules:
#       # Hier hängt noch ein Speicher, der mit Discard nicht umgehen kann.
#       discard: off
#       # Neu im Cluster: erst einmal nur mitschreiben.
#       iothread: report
#       # Dieser Node trägt fast nur Container und startet schneller.
#       startup:
#         lxc:
#           up: 5s
#       # Hier hängt nur eine Gigabit-Leitung am Node.
#       net_rate:
#         rate: 60
#     # Dieser Node hat eine Vorgeschichte mit abstürzenden Diensten —
#     # hier darf der Monitor schärfer sein als im Rest des Clusters.
#     services:
#       mode: enforce
#       restart_limit: 5
#     # Auf diesem Node stehen nur Wegwerf-Gäste — die Backup-Prüfung
#     # würde hier jede Woche dasselbe melden.
#     advice:
#       backup_coverage: off
#     pools:
#       # Gleicher Name, langsamere Platte als auf den anderen Nodes.
#       local-pool:
#         mbps_wr: 80
#     defaults:
#       mbps_rd: 150
#       mbps_wr: 100

# ---------------------------------------------------------------------------
# Vollständiges Beispiel: eine NVMe der 4. Generation, rund 10 VMs darauf
# ---------------------------------------------------------------------------
#
# Ausgangslage — was so eine Platte in der Praxis leistet:
#
#   sequenziell lesen     ~7000 MB/s
#   sequenziell schreiben ~5000 MB/s in der Spitze, aber nur solange der
#                         SLC-Cache reicht; danach bleiben bei TLC real
#                         1500–2500 MB/s übrig. Schreiben ist der Engpass.
#   4K zufällig           Die Datenblätter nennen 600.000+ IOPS. Die gelten
#                         bei einem einzelnen Strom mit hoher Warteschlange.
#                         Bei zehn VMs mit gemischter Last sind 200.000 bis
#                         400.000 IOPS realistisch.
#
# Die Rechnung: Die Dauerrate wird so gewählt, dass alle zehn VMs zusammen
# die Platte nicht überfahren — 10 × 500 MB/s Lesen sind 5000 MB/s und damit
# rund 70 % des Möglichen. Beim Schreiben liegt die Summe mit 10 × 200 MB/s
# bei 2000 MB/s, also im Bereich dessen, was die Platte dauerhaft schafft.
#
# Der Burst ist der eigentliche Trick: Normale Arbeit — booten, ein Paket
# installieren, eine Datei kopieren — dauert Sekunden und läuft mit voller
# Geschwindigkeit. Erst wer länger als zehn Sekunden Vollgas gibt, fällt auf
# die Dauerrate zurück. Genau das trifft Restores und durchgehende Last,
# also die Fälle, in denen eine VM den ganzen Node lahmlegt.
nvme-gen4:
  # Lesen: 500 MB/s dauerhaft, 2000 MB/s für höchstens 10 Sekunden
  mbps_rd: 500
  mbps_rd_max: 2000
  bps_rd_max_length: 10

  # Schreiben: strenger, weil der SLC-Cache sonst volläuft
  mbps_wr: 200
  mbps_wr_max: 1000
  bps_wr_max_length: 10

  # IOPS: 10 × 15.000 = 150.000 dauerhaft, gut im Rahmen
  iops_rd: 15000
  iops_rd_max: 60000
  iops_rd_max_length: 10

  iops_wr: 8000
  iops_wr_max: 30000
  iops_wr_max_length: 10

# Diese Werte sind ein belastbarer Startpunkt, keine Wahrheit. Wer es genau
# wissen will, misst die eigene Platte und teilt das Ergebnis auf:
#
#   fio --name=lesen --filename=/pfad/testdatei --size=8G --rw=randread \
#       --bs=4k --iodepth=32 --numjobs=4 --runtime=60 --time_based --direct=1
#
# Zwei Dinge, die die Rechnung verschieben:
#   - ZFS kostet Leistung (Copy-on-Write, Prüfsummen, Kompression). Bei
#     einem Pool aus mehreren Platten steigt die Summe dagegen wieder.
#   - Nicht alle zehn VMs arbeiten gleichzeitig. Wer weiß, dass nur zwei
#     davon dauerhaft Last erzeugen, darf die Dauerrate höher ansetzen.

# Statt getrennt nach Lesen und Schreiben geht auch ein gemeinsames Limit
# für beide Richtungen. Beides zusammen lehnt QEMU ab, deshalb prüft der
# Dienst das beim Start und rührt an einer Platte, die bereits die andere
# Variante nutzt, die jeweilige Familie nicht an.
#
#  backup-store:
#    mbps: 150
#    mbps_max: 300
#    bps_max_length: 5
#    iops: 4000
