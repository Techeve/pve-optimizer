<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="pve-optimizer">
  <!-- pve-optimizer Mark, adaptiv: folgt dem hell/dunkel-Schema des
       Betrachters. Zusammengeführt aus logo/pve-optimizer-icon-{light,dark}.svg
       im Projekt-Repo — dort sind es zwei Dateien, hier muss eine genügen:
       Die Karte bindet das Logo als <img> ein, und ein <img> kann nicht je
       nach Modus die Quelle wechseln. -->
  <title>pve-optimizer</title>
  <desc>Drei Schieberegler auf unterschiedlicher Hoehe: der eingestellte Bereich cyan, die Regler kontrastierend mit Griffkerbe.</desc>
  <style>
    .spur { fill: #0f2333; fill-opacity: 0.15; }
    .bereich { fill: #19b6c7; }
    .regler { fill: #0f2333; }
    .kerbe { fill: #19b6c7; fill-opacity: 0.55; }
    @media (prefers-color-scheme: dark) {
      .spur { fill: #e3edf3; fill-opacity: 0.18; }
      .bereich { fill: #3ed0df; }
      .regler { fill: #e3edf3; }
      .kerbe { fill: #0f2333; fill-opacity: 0.45; }
    }
  </style>
  <g>
    <!-- Regler 1 -->
    <rect x="104" y="76" width="24" height="360" rx="12" class="spur"/>
    <rect x="104" y="168" width="24" height="268" rx="12" class="bereich"/>
    <rect x="68" y="148" width="96" height="40" rx="14" class="regler"/>
    <rect x="104" y="162" width="24" height="4" rx="2" class="kerbe"/>
    <rect x="104" y="170" width="24" height="4" rx="2" class="kerbe"/>

    <!-- Regler 2 -->
    <rect x="244" y="76" width="24" height="360" rx="12" class="spur"/>
    <rect x="244" y="300" width="24" height="136" rx="12" class="bereich"/>
    <rect x="208" y="280" width="96" height="40" rx="14" class="regler"/>
    <rect x="244" y="294" width="24" height="4" rx="2" class="kerbe"/>
    <rect x="244" y="302" width="24" height="4" rx="2" class="kerbe"/>

    <!-- Regler 3 -->
    <rect x="384" y="76" width="24" height="360" rx="12" class="spur"/>
    <rect x="384" y="232" width="24" height="204" rx="12" class="bereich"/>
    <rect x="348" y="212" width="96" height="40" rx="14" class="regler"/>
    <rect x="384" y="226" width="24" height="4" rx="2" class="kerbe"/>
    <rect x="384" y="234" width="24" height="4" rx="2" class="kerbe"/>
  </g>
</svg>
